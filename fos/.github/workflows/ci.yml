# This workflow runs deterministic backend, frontend, and browser checks.
#
# Real Ollama scenarios and long health checks remain part of the full local
# suite because routine CI does not provision local language models.

name: CI

on:
  push:
    branches: [main, beta]
  pull_request:
    branches: [main, beta]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install Python test dependencies
        run: pip install -r requirements-test.txt

      - name: Install fos package
        run: pip install -e .

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Install Playwright browser
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: Run Python tests with coverage
        env:
          PYTHONPATH: src
        run: >
          python -m pytest tests/
          -q --no-header
          --cov=fos.core
          --cov-fail-under=58
          --ignore=tests/llm_prompt_testing
          --ignore=tests/smoke_tests
          --ignore=tests/integration/test_real_llm_phase1.py
          --ignore=tests/integration/test_llm_action_selection.py
          --ignore=tests/load

      - name: Run frontend tests
        working-directory: frontend
        run: npm run test:run

      - name: Run Node load-helper tests
        run: node --test tests/load/lib/loadUsers.test.mjs

      - name: Run deterministic browser smoke tests
        working-directory: frontend
        run: npm run test:e2e:smoke

      - name: Upload Playwright diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-diagnostics
          path: |
            frontend/e2e/collected-results
            frontend/test-results
          if-no-files-found: ignore
