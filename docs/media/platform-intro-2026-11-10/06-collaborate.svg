<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080" role="img" aria-labelledby="title desc"><title id="title">把新的问题带进这个世界</title><desc id="desc">多人部署、课堂参与，以及开放的代码与扩展空间。。GAWorld 功能示意，非产品截图或实测结果。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#163b30"/></marker></defs><g font-family="PingFang SC, Hiragino Sans GB, sans-serif"><rect x="0" y="0" width="1920" height="1080" rx="0" fill="#f3f1e7" stroke="none" stroke-width="2"/><rect x="0" y="0" width="1920" height="246" rx="0" fill="#163b30" stroke="none" stroke-width="2"/><text x="80" y="64" font-size="25" fill="#d6ee73" font-weight="600">GAWorld / SOCIAL LAB</text><text x="80" y="143" font-size="58" fill="#ffffff" font-weight="600">把新的问题带进这个世界</text><text x="80" y="202" font-size="27" fill="#cedbd0" font-weight="400">多人部署、课堂参与，以及开放的代码与扩展空间。</text><text x="1760" y="76" font-size="36" fill="#d6ee73" font-weight="400">06</text><path d="M 80 987 H 1840" fill="none" stroke="#c9d2c7" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="80" y="1031" font-size="25" fill="#163b30" font-weight="600">从一个人，到整个世界。</text><text x="1040" y="1031" font-size="23" fill="#567065" font-weight="400">功能示意 · 非产品截图或实测结果</text><text x="1700" y="1031" font-size="26" fill="#163b30" font-weight="600">GAWorld</text><rect x="80" y="300" width="568" height="310" rx="20" fill="#ffffff" stroke="none" stroke-width="2"/><text x="110" y="353" font-size="22" fill="#567065" font-weight="400">01</text><text x="110" y="405" font-size="36" fill="#163b30" font-weight="600">个人世界</text><text x="110" y="458" font-size="27" fill="#567065" font-weight="400">分别保存居民与运行产物</text><text x="110" y="501" font-size="27" fill="#567065" font-weight="400">按用户权限使用平台</text><path d="M 654 455 H 663" fill="none" stroke="#163b30" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><rect x="672" y="300" width="568" height="310" rx="20" fill="#ffffff" stroke="none" stroke-width="2"/><text x="702" y="353" font-size="22" fill="#567065" font-weight="400">02</text><text x="702" y="405" font-size="36" fill="#163b30" font-weight="600">开放世界</text><text x="702" y="458" font-size="27" fill="#567065" font-weight="400">参与者认领居民</text><text x="702" y="501" font-size="27" fill="#567065" font-weight="400">选择行动、参与互动</text><path d="M 1246 455 H 1255" fill="none" stroke="#163b30" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><rect x="1264" y="300" width="568" height="310" rx="20" fill="#ffffff" stroke="none" stroke-width="2"/><text x="1294" y="353" font-size="22" fill="#567065" font-weight="400">03</text><text x="1294" y="405" font-size="36" fill="#163b30" font-weight="600">课堂情境</text><text x="1294" y="458" font-size="27" fill="#567065" font-weight="400">教师组织模拟场景</text><text x="1294" y="501" font-size="27" fill="#567065" font-weight="400">学生讨论并观察后续</text><rect x="80" y="670" width="1752" height="280" rx="20" fill="#163b30" stroke="none" stroke-width="2"/><text x="120" y="735" font-size="39" fill="#d6ee73" font-weight="600">开源项目 · 欢迎探索与贡献</text><text x="120" y="815" font-size="54" fill="#ffffff" font-weight="600">github.com/wuchaozju/GAWorld</text><text x="120" y="893" font-size="29" fill="#ffffff" font-weight="400">部署与权限按场景配置；模拟结果仍需现实证据检验。</text></g></svg>