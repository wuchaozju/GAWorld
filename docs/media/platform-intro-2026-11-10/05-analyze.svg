<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080" role="img" aria-labelledby="title desc"><title id="title">看见过程，也能回到记录</title><desc id="desc">回放、世界比较与报告导出，共同构成可以回看的分析材料。。GAWorld 功能示意，非产品截图或实测结果。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#163b30"/></marker></defs><g font-family="PingFang SC, Hiragino Sans GB, sans-serif"><rect x="0" y="0" width="1920" height="1080" rx="0" fill="#f3f1e7" stroke="none" stroke-width="2"/><rect x="0" y="0" width="1920" height="246" rx="0" fill="#163b30" stroke="none" stroke-width="2"/><text x="80" y="64" font-size="25" fill="#d6ee73" font-weight="600">GAWorld / SOCIAL LAB</text><text x="80" y="143" font-size="58" fill="#ffffff" font-weight="600">看见过程，也能回到记录</text><text x="80" y="202" font-size="27" fill="#cedbd0" font-weight="400">回放、世界比较与报告导出，共同构成可以回看的分析材料。</text><text x="1760" y="76" font-size="36" fill="#d6ee73" font-weight="400">05</text><path d="M 80 987 H 1840" fill="none" stroke="#c9d2c7" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="80" y="1031" font-size="25" fill="#163b30" font-weight="600">从一个人，到整个世界。</text><text x="1040" y="1031" font-size="23" fill="#567065" font-weight="400">功能示意 · 非产品截图或实测结果</text><text x="1700" y="1031" font-size="26" fill="#163b30" font-weight="600">GAWorld</text><rect x="80" y="290" width="1120" height="400" rx="20" fill="#ffffff" stroke="none" stroke-width="2"/><text x="115" y="350" font-size="36" fill="#163b30" font-weight="600">沿时间轴回看居民轨迹</text><circle cx="220" cy="470" r="16" fill="#d6ee73"/><circle cx="390" cy="530" r="16" fill="#d6ee73"/><circle cx="575" cy="450" r="16" fill="#d6ee73"/><circle cx="765" cy="550" r="16" fill="#d6ee73"/><circle cx="1000" cy="430" r="16" fill="#d6ee73"/><path d="M 220 470 L 390 530 L 575 450 L 765 550 L 1000 430" fill="none" stroke="#163b30" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><circle cx="575" cy="392" r="19" fill="#163b30"/><path d="M 545 447 Q 545 418 575 418 Q 605 418 605 447" fill="none" stroke="#163b30" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/><text x="120" y="650" font-size="25" fill="#567065" font-weight="400">路径仅示意回放方式，不代表一次真实运行</text><rect x="1240" y="290" width="600" height="400" rx="20" fill="#163b30" stroke="none" stroke-width="2"/><text x="1275" y="350" font-size="36" fill="#ffffff" font-weight="600">检查变化的依据</text><text x="1275" y="430" font-size="30" fill="#ffffff" font-weight="400">居民状态与活动记录</text><text x="1275" y="505" font-size="30" fill="#ffffff" font-weight="400">关系变化与运行日志</text><text x="1275" y="580" font-size="30" fill="#ffffff" font-weight="400">基准世界与处理世界</text><path d="M 155 816 H 1760" fill="none" stroke="#163b30" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><circle cx="180" cy="816" r="13" fill="#163b30"/><text x="140" y="875" font-size="29" fill="#163b30" font-weight="400">开始</text><circle cx="675" cy="816" r="13" fill="#163b30"/><text x="635" y="875" font-size="29" fill="#163b30" font-weight="400">事件发生</text><circle cx="1170" cy="816" r="13" fill="#163b30"/><text x="1130" y="875" font-size="29" fill="#163b30" font-weight="400">继续观察</text><circle cx="1665" cy="816" r="13" fill="#163b30"/><text x="1625" y="875" font-size="29" fill="#163b30" font-weight="400">查看终局</text><rect x="1300" y="913" width="450" height="56" rx="28" fill="#d6ee73" stroke="none" stroke-width="2"/><text x="1324" y="951" font-size="25" fill="#163b30" font-weight="400">导出研究报告</text></g></svg>