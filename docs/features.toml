# GAWorld 功能注册表：功能地图（docs/FEATURE_MAP.html）由它生成。
#
# 加一个功能：在 docs/FEATURES.md 写一行详细说明，再在这里的合适分组下加一项，
# features 填那一行的「功能特性」列（或 FEATURES.md 里的 ## 标题），然后运行
#     python scripts/build_feature_map.py
# tests/test_feature_registry.py 检查：两边一一对得上、地图是最新的、doc 指向的教程
# 在文档面板（site/dashboard/docs.js）和两份 README 里都列出来了。
#
# 字段：name 名称；desc 一句话；entry 入口（反引号里是代码）；features 对应 FEATURES.md
# 的行；doc 可选的教程；mind 可选的导图短名（默认由 name 生成）。

[[axis]]
id = "research"
name = "研究者"
emoji = "🔬"
tagline = "把 GAWorld 当实验台"

[[axis.group]]
name = "调研与提问"

[[axis.group.feature]]
name = "智能体采访"
desc = "单 agent 深度访谈"
entry = "`interview --agent-id 31 --question \"...\"`"
features = ["智能体采访"]

[[axis.group.feature]]
name = "群体采访"
desc = "一群受访者同一套题，可跨城市，连续追问"
entry = "`/site/dashboard/survey.html`"
features = ["群体采访"]
doc = "docs/GROUP_INTERVIEW_TUTORIAL.md"

[[axis.group.feature]]
name = "RAG 外部知识注入"
desc = "向某 agent 注入外部信息改变认知"
entry = "`rag-add --agent-id 31 --text ...`"
features = ["RAG 外部知识注入"]

[[axis.group.feature]]
name = "从社交内容创建智能体"
desc = "社媒页面 / 文本生成画像"
entry = "`create-agent-from-social --url ...`"
features = ["从社交内容创建智能体"]

[[axis.group]]
name = "单点对照实验"

[[axis.group.feature]]
name = "事件对照实验"
desc = "有/无事件两分支并行"
entry = "`compare-event --event-name ... --seed 42`"
features = ["事件对照实验"]

[[axis.group.feature]]
name = "平行世界实验"
desc = "最多 8 个世界共用居民/种子"
entry = "`parallel-worlds --spec worlds.json`"
features = ["平行世界实验"]
doc = "docs/PARALLEL_WORLDS_TUTORIAL.md"

[[axis.group.feature]]
name = "平行世界实验台"
desc = "设计实验 + 分叉图 + 偏离曲线"
