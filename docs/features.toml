desc = "同任务两条相反的路子，评审拿到「方案一/方案二」洗队名"
features = ["游戏场（斗兽场 · 说服游戏 · 灾害模式 · 谣言扩散局 · 双队竞赛 · 公投局 · 猜人局 · 谁是真人）"]

[[axis.group.feature]]
name = "公投局"
desc = "≤14 人先私下表态，再公开表决，中间那屏带票数与最响原话"
features = ["游戏场（斗兽场 · 说服游戏 · 灾害模式 · 谣言扩散局 · 双队竞赛 · 公投局 · 猜人局 · 谁是真人）"]

[[axis.group.feature]]
name = "猜人局"
desc = "读档案猜两难里怎么选，「再问一次」量 persona 稳不稳"
features = ["游戏场（斗兽场 · 说服游戏 · 灾害模式 · 谣言扩散局 · 双队竞赛 · 公投局 · 猜人局 · 谁是真人）"]

[[axis.group.feature]]
name = "谁是真人"
desc = "真人和居民匿名同聊几轮，再互猜谁是真人；存档供 Bench Track D"
features = ["游戏场（斗兽场 · 说服游戏 · 灾害模式 · 谣言扩散局 · 双队竞赛 · 公投局 · 猜人局 · 谁是真人）"]

[[axis.group]]
name = "协作与创作"

[[axis.group.feature]]
name = "Dashboard 智能体互动"
desc = "两位以上居民建立双向好友，多轮讨论"
entry = "`/dashboard` 互动面板"
features = ["Dashboard 智能体互动"]

[[axis.group.feature]]
name = "Dashboard 合作任务"
desc = "规划→分工→汇总"
entry = "`/site/dashboard/collaboration.html`"
features = ["Dashboard 合作任务"]

[[axis.group.feature]]
name = "合作产物导出"
desc = "Markdown 产物落到"
entry = "`<sessions_dir>/<session_id>/artifacts/`"
features = ["Dashboard 合作任务"]

[[axis.group.feature]]
name = "Dashboard 群体智能众包"
desc = "一个大任务交给大规模居民池独立作答，多轮筛选出表现好的那一批"
entry = "`/site/dashboard/collaboration.html?tab=crowd`"
features = ["Dashboard 群体智能众包"]

[[axis.group.feature]]
name = "四种协作机制"
desc = "市场竞价（报价出清决定谁动手，arXiv:2610.22322）· 众包投票 · 精英进化 · 辩论评审"
entry = "「群体智能众包」页签的机制卡片"
features = ["Dashboard 群体智能众包"]

[[axis.group.feature]]
name = "众包过程可观测"
desc = "投标市场、本轮作答、评审理由、信用榜与存活人数逐轮可见"
entry = "`GET /api/crowdsourcing/sessions/<id>/rounds`"
features = ["Dashboard 群体智能众包"]

[[axis.group]]
name = "观察与回放"

[[axis.group.feature]]
name = "轨迹回放查看器"
desc = "可视化回放任意一次仿真"
entry = "`serve-viz --port 8000`"
features = ["轨迹回放查看器"]

[[axis.group.feature]]
name = "平行世界实验台"
desc = "读分叉图、偏离曲线、终局差异"
entry = "`/site/dashboard/worlds.html`"
features = ["平行世界实验"]

[[axis]]
id = "dev"
name = "平台开发者"
emoji = "🛠"
tagline = "改 GAWorld 自己"

[[axis.group]]
name = "插件与扩展"

[[axis.group.feature]]
name = "微内核与 21 个扩展点"
desc = "感知注入/中断源/动作过滤/状态效果等"
features = ["第三方插件"]
doc = "docs/PLUGIN_AUTHORING.md"

[[axis.group.feature]]
name = "第三方插件"
desc = "不改核心加子系统（CONFIG[\"plugins\"] 或 entry point）"
features = ["第三方插件"]

[[axis.group.feature]]
name = "认知管线消融/定制"
desc = "agent step 12 个命名阶段可配置"
entry = "`CONFIG[\"pipeline\"][\"agent_step\"]`"
features = ["认知管线消融 / 定制"]

[[axis.group.feature]]
name = "运行时干预"
desc = "改状态/配置/注入人生事件/移除 agent，审计全留痕"
features = ["运行时干预"]

[[axis.group.feature]]
name = "动作校验门"
desc = "move 过校验链，deny 审计落盘并在下一 tick 感知回注"
features = ["动作校验门"]

[[axis.group]]
name = "部署与运维"

[[axis.group.feature]]
name = "分布式 relay"
desc = "多机协同仿真，各节点处理本地 agent 子集"
entry = "`serve-distributed --port 8877`"
features = ["分布式 relay"]

[[axis.group.feature]]
name = "日志模式"
desc = "simple ~4 行/tick, verbose 全字段"
entry = "`GAWORLD_LOG_MODE`"
features = ["日志模式"]

[[axis.group.feature]]
name = "日志级别"
desc = "DEBUG 下显示每次 LLM 调用的 token 与延迟"
entry = "`GAWORLD_LOG_LEVEL`"
features = ["日志级别"]

[[axis.group.feature]]
name = "统一事件流"
desc = "跨插件时间线对齐的结构化记录"
entry = "`output/records/*.jsonl`"
features = ["统一事件流"]

[[axis.group]]
name = "仿真v2 能力"
note = "与运行时能力相关"

[[axis.group.feature]]
name = "物理环境感知（P0）"
desc = "节点级占用/营业状态"
entry = "`CONFIG[\"environment\"][\"local_physical\"][\"enabled\"]`"
features = ["物理环境感知（P0）"]

[[axis.group.feature]]
name = "异常一等公民（P2）"
desc = "anomaly/anomaly_score 区分常态波动"
entry = "`CONFIG[\"environment\"][\"anomaly\"][\"enabled\"]`"
features = ["异常一等公民（P2）"]

[[axis.group.feature]]
name = "当日反应式重规划（P3）"
desc = "持续异常时只重排受影响区间"
entry = "`CONFIG[\"environment\"][\"replan\"][\"enabled\"]`"
features = ["当日反应式重规划（P3）"]

[[axis.group.feature]]
name = "结构化空间学习（P4）"
desc = "累积地点规避偏好，跨运行持久化"
entry = "`CONFIG[\"environment\"][\"spatial_preferences\"][\"enabled\"]`"
features = ["结构化空间学习（P4）"]

[[axis.group.feature]]
name = "场所容量（满了就进不去）"
desc = "满员改去同类最近有空位的场所，都满则去不成（默认关）"
entry = "`CONFIG[\"local_physical\"][\"capacity\"]`"
features = ["场所容量（满了就进不去）"]

[[axis.group.feature]]
name = "室内房间（同屋才算碰面）"
desc = "分户、按活动进房间、同屋才算偶遇、容量按房间算（默认关）"
entry = "`CONFIG[\"local_physical\"][\"rooms\"]`"
features = ["室内房间（同屋才算碰面）"]
