<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>GAWorld Console</title>
  <meta name="description" data-i18n-content="console.shell_description" content="GAWorld 一体化控制台：控制台 · 仿真回放 · 智能体工作台" />
  <link rel="stylesheet" href="/site/console/console.css" />
</head>
<body>
  <header class="console-bar">
    <button type="button" class="nav-toggle" id="navToggle" aria-controls="sidebar" aria-expanded="true" data-i18n-title="console.collapse_nav" title="收起导航">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
    </button>
    <a class="brand" href="/" data-i18n-title="console.home_title" title="返回首页">
      <span class="brand-mark">GA</span>
      <span class="brand-name">GAWorld Console</span>
    </a>
    <div class="crumb" id="crumb" aria-live="polite">
      <span class="crumb-group" id="crumbGroup"></span>
      <span class="crumb-sep" aria-hidden="true">/</span>
      <strong class="crumb-view" id="crumbView"></strong>
    </div>
    <div class="bar-right">
      <span class="world-chip" id="worldChip" hidden>
        <select id="worldSelect" data-i18n-aria="world.label" aria-label="世界"></select>
        <button type="button" class="open-new" id="worldManageBtn" data-i18n="world.manage">管理世界</button>
      </span>
      <span class="user-chip" id="userChip" hidden>
        <span id="userName"></span>
        <button type="button" class="open-new" id="logoutBtn" data-i18n="console.logout">退出登录</button>
      </span>
      <a class="open-new" id="openNew" href="#" target="_blank" rel="noopener" data-i18n-title="console.open_new_title" title="在新窗口打开当前视图"><span data-i18n="console.open_new">在新窗口打开</span> ↗</a>
      <div class="lang-switch" role="group" data-i18n-aria="lang.switch_label" aria-label="切换语言">
        <button type="button" class="lang-btn" id="lang-zh-btn" lang="zh-CN" aria-pressed="true">中文</button>
        <button type="button" class="lang-btn" id="lang-en-btn" lang="en" aria-pressed="false">EN</button>
      </div>
    </div>
  </header>

  <div class="console-body">
    <!-- The views, grouped by the stage of a study they belong to. The same
         five groups, in the same order, are the landing page's 功能入口. -->
    <nav class="sidebar" id="sidebar" aria-label="views">
      <div class="tabs" id="tabs" role="tablist" aria-orientation="vertical">
        <section class="nav-group">
          <h2 class="nav-group-label"><span data-i18n="nav.group_build">构建</span><span class="en">Build</span></h2>
          <button class="tab" role="tab" data-tab="city">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 21h18M6 21V7h5v14M11 21V11h5v10M16 21v-6h3v6M8 10h1M8 13h1M8 16h1"/></svg>
            <span class="tab-text"><span data-i18n="nav.city">城市</span><span class="en">Cities</span></span>
          </button>
          <button class="tab" role="tab" data-tab="population">
            <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="9" cy="8" r="3.5"/><path d="M2.5 20a6.5 6.5 0 0 1 13 0"/><circle cx="17" cy="9" r="2.6"/><path d="M15.5 14.2a5 5 0 0 1 6 4.8"/></svg>
            <span class="tab-text"><span data-i18n="nav.population">人口与群体</span><span class="en">Population</span></span>
          </button>
          <button class="tab" role="tab" data-tab="studio">
            <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/></svg>
            <span class="tab-text"><span data-i18n="nav.studio">智能体工作台</span><span class="en">Agent Studio</span></span>
          </button>
        </section>

        <section class="nav-group">
          <h2 class="nav-group-label"><span data-i18n="nav.group_run">运行</span><span class="en">Run</span></h2>
          <button class="tab" role="tab" data-tab="dashboard">
            <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="3" width="7" height="9" rx="1.5"/><rect x="14" y="3" width="7" height="5" rx="1.5"/><rect x="14" y="12" width="7" height="9" rx="1.5"/><rect x="3" y="16" width="7" height="5" rx="1.5"/></svg>
            <span class="tab-text"><span data-i18n="nav.dashboard">控制台</span><span class="en">Dashboard</span></span>
          </button>
          <button class="tab" role="tab" data-tab="simviz">
            <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M10 8.5v7l5.5-3.5z"/></svg>
            <span class="tab-text"><span data-i18n="nav.simviz">仿真回放</span><span class="en">Simulation</span></span>
          </button>
        </section>

        <section class="nav-group">
          <h2 class="nav-group-label"><span data-i18n="nav.group_experiment">实验</span><span class="en">Experiment</span></h2>
          <button class="tab" role="tab" data-tab="worlds">
            <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="6" cy="5" r="2.2"/><circle cx="6" cy="19" r="2.2"/><circle cx="18" cy="8" r="2.2"/><path d="M6 7.2v9.6M18 10.2c0 4.4-12 2.6-12 6.6"/></svg>
            <span class="tab-text"><span data-i18n="nav.worlds">平行世界</span><span class="en">Parallel Worlds</span></span>
          </button>
          <button class="tab" role="tab" data-tab="collaboration">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M10 13a4 4 0 0 0 5.7 0l3-3a4 4 0 0 0-5.7-5.7l-1.5 1.5"/><path d="M14 11a4 4 0 0 0-5.7 0l-3 3a4 4 0 0 0 5.7 5.7l1.5-1.5"/></svg>
            <span class="tab-text"><span data-i18n="nav.collaboration">合作任务</span><span class="en">Cooperation</span></span>
          </button>
          <button class="tab" role="tab" data-tab="games">
            <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="2" y="7" width="20" height="11" rx="4"/><path d="M7 11v3M5.5 12.5h3M16 12h.01M18.5 14.5h.01"/></svg>
            <span class="tab-text"><span data-i18n="nav.games">游戏场</span><span class="en">Playground</span></span>
          </button>
          <button class="tab" role="tab" data-tab="play">
            <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="8" cy="8" r="3"/><circle cx="16" cy="8" r="3"/><path d="M3 20a5 5 0 0 1 10 0M11 20a5 5 0 0 1 10 0"/></svg>
            <span class="tab-text"><span data-i18n="nav.play">多人共玩</span><span class="en">Play Together</span></span>
          </button>
          <button class="tab" role="tab" data-tab="survey">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M21 15a2 2 0 0 1-2 2H8l-5 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/><path d="M8 9h8M8 12.5h5"/></svg>
            <span class="tab-text"><span data-i18n="nav.survey">群体采访</span><span class="en">Group Interview</span></span>
          </button>
          <button class="tab" role="tab" data-tab="external">
            <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3a14 14 0 0 1 0 18M12 3a14 14 0 0 0 0 18"/></svg>
            <span class="tab-text"><span data-i18n="nav.external">外部系统</span><span class="en">External</span></span>
          </button>
        </section>

        <section class="nav-group">
          <h2 class="nav-group-label"><span data-i18n="nav.group_analyze">分析</span><span class="en">Analyze</span></h2>
          <button class="tab" role="tab" data-tab="analytics">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 20v-7M11 20V6M17 20v-10M3 20h18"/></svg>
            <span class="tab-text"><span data-i18n="nav.analytics">结果分析</span><span class="en">Analytics</span></span>
          </button>
          <button class="tab" role="tab" data-tab="research">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 3h6M10 3v6l-5.5 9.5A2 2 0 0 0 6.2 21h11.6a2 2 0 0 0 1.7-2.5L14 9V3"/><path d="M7.5 15h9"/></svg>
            <span class="tab-text"><span data-i18n="nav.research">研究工作台</span><span class="en">Research</span></span>
          </button>
        </section>

        <section class="nav-group">
          <h2 class="nav-group-label"><span data-i18n="nav.group_system">系统</span><span class="en">System</span></h2>
          <button class="tab" role="tab" data-tab="admin" hidden>
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3l8 3v6c0 4.5-3.4 8.3-8 9-4.6-.7-8-4.5-8-9V6z"/><path d="M9 12l2 2 4-4"/></svg>
            <span class="tab-text"><span data-i18n="nav.admin">教师控制台</span><span class="en">Teacher</span></span>
          </button>
          <button class="tab" role="tab" data-tab="settings">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h9M17 7h3M4 12h3M11 12h9M4 17h11M19 17h1"/><circle cx="15" cy="7" r="2"/><circle cx="9" cy="12" r="2"/><circle cx="17" cy="17" r="2"/></svg>
            <span class="tab-text"><span data-i18n="nav.settings">配置</span><span class="en">Settings</span></span>
          </button>
          <button class="tab" role="tab" data-tab="docs">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 4.5A2.5 2.5 0 0 1 6.5 2H20v18H6.5A2.5 2.5 0 0 0 4 22z"/><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/></svg>
            <span class="tab-text"><span data-i18n="nav.docs">文档</span><span class="en">Docs</span></span>
          </button>
        </section>
      </div>
    </nav>
    <div class="nav-backdrop" id="navBackdrop" hidden></div>

    <main class="frames" id="frames">
      <div class="frame-loading" id="frameLoading" hidden>
        <span class="spinner" aria-hidden="true"></span>
        <span data-i18n="console.loading_view">正在载入视图…</span>
      </div>
    </main>
  </div>

  <dialog class="world-dialog" id="worldDialog">
    <section id="worldCurrent">
      <h2 data-i18n="world.current_title">当前世界</h2>
      <p class="world-note" id="worldCurrentNote"></p>
      <div id="worldOwnerControls" hidden>
        <label for="worldVisibility" data-i18n="world.visibility">可见性</label>
        <select id="worldVisibility">
          <option value="private" data-i18n="world.vis_private">私有：只有我</option>
          <option value="class" data-i18n="world.vis_class">班级：大家只读</option>
          <option value="open" data-i18n="world.vis_open">开放：大家可进入查看</option>
        </select>
        <label for="worldWait" data-i18n="world.wait_label">每个 tick 等玩家（秒，0 = 不等）</label>
        <input id="worldWait" type="number" min="0" max="300" step="5" value="0">
        <button type="button" class="danger" id="worldDeleteBtn" data-i18n="world.delete">删除这个世界</button>
      </div>
    </section>
    <form id="worldCreateForm">
      <h2 data-i18n="world.new_title">新建世界</h2>
      <label for="worldName" data-i18n="world.name">名称</label>
      <input id="worldName" maxlength="64" required>
      <label for="worldCity" data-i18n="world.city">城市</label>
      <select id="worldCity"></select>
      <button type="submit" id="worldCreateBtn" data-i18n="world.create">创建并进入</button>
    </form>
    <p class="world-error" id="worldError" role="alert"></p>
    <button type="button" class="open-new" id="worldCloseBtn" data-i18n="world.close">关闭</button>
  </dialog>
  <script src="/site/dashboard/i18n.js"></script>
  <script src="/site/console/console.js"></script>
</body>
</html>
