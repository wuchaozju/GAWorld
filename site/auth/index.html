<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GAWorld · 登录</title>
<!-- Self-contained so visitors can sign in without protected assets. -->
<style>
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center;
         font-family: -apple-system, "PingFang SC", "Noto Sans SC", sans-serif; background: #f4f1ea; color: #222; }
  main { width: min(360px, 92vw); background: #fff; border-radius: 12px; padding: 28px;
         box-shadow: 0 6px 24px rgba(0,0,0,.08); }
  .auth-brand { display: block; width: 240px; max-width: 100%; height: auto; margin: 0 auto 22px; }
  h1 { font-size: 20px; margin: 0 0 4px; }
  p.hint { margin: 0 0 18px; color: #666; font-size: 13px; }
  label { display: block; font-size: 13px; margin: 12px 0 4px; }
  input { width: 100%; box-sizing: border-box; padding: 9px 10px; font-size: 15px;
          border: 1px solid #ccc; border-radius: 8px; }
  button { width: 100%; margin-top: 18px; padding: 10px; font-size: 15px; border: 0; border-radius: 8px;
           background: #2f4f7f; color: #fff; cursor: pointer; }
  button:disabled { opacity: .6; cursor: default; }
  .error { color: #b3261e; font-size: 13px; min-height: 18px; margin-top: 10px; }
  nav { margin-top: 16px; font-size: 13px; display: flex; justify-content: space-between; }
  nav a { color: #2f4f7f; }
  [hidden] { display: none !important; }
</style>
  <link rel="icon" type="image/png" href="/site/auth/brand/gaworld-symbol-a.png" />
</head>
<body>
<main>
  <img class="auth-brand" src="/site/auth/brand/gaworld-lockup-a.png" alt="GAWorld" width="240" height="80">
  <h1 id="title">登录 GAWorld</h1>
  <p class="hint" id="hint">用昵称和密码登录。</p>
  <form id="form" method="post" autocomplete="on">
    <div id="code-row" hidden>
      <label for="code" id="code-label">邀请码</label>
      <input id="code" name="code" autocomplete="off">
    </div>
    <div id="nickname-row">
      <label for="nickname">昵称</label>
      <input id="nickname" name="nickname" autocomplete="username" maxlength="32">
    </div>
    <div id="email-row" hidden><label for="email">邮箱</label><input id="email" name="email" type="email" autocomplete="email" maxlength="254"></div>
    <div id="display-row" hidden><label for="display_name">公开显示名</label><input id="display_name" name="display_name" maxlength="32" autocomplete="nickname"></div>
    <div id="password-row">
    <label for="password">密码</label>
    <input id="password" name="password" type="password" minlength="8" autocomplete="current-password">
    </div>
    <div id="confirm-row" hidden>
      <label for="confirm">再输一次密码</label>
      <input id="confirm" name="confirm" type="password" autocomplete="new-password">
    </div>
    <button id="submit" type="submit" disabled>登录</button>
    <div class="error" id="error" role="alert"></div>
  </form>
  <nav>
    <a href="/join" id="to-join">有邀请码？注册</a>
    <a href="/reset" id="to-reset">有重置码？重设密码</a>
    <a href="/login" id="to-login" hidden>返回登录</a>
  </nav>
</main>
<script src="/site/auth/auth.js"></script>
</body>
</html>
