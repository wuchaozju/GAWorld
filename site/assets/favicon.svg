<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- GA monogram on the brand green, square with subtle rounding so it reads
       as an icon at favicon size (16/32) and as a tab badge. Same
       --green-deep as the landing topbar brand-mark. -->
  <rect width="64" height="64" rx="12" fill="#0a4a37"/>
  <text x="32" y="42" text-anchor="middle" font-family="Georgia, 'Noto Serif SC', serif"
        font-weight="700" font-size="30" fill="#ffffff" letter-spacing="-1">GA</text>
</svg>