<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 480" role="img" aria-label="城市实验室示意图：居民在街区间活动，两个平行世界比较同一事件的影响" font-family="Avenir Next, PingFang SC, sans-serif">
