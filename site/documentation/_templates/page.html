{% extends "!page.html" %}
{% block body %}
{{ super() }}
<details class="doc-tools">
  <summary aria-label="文档版本与下载"><span>文档</span><span class="doc-language">zh-cn</span><span class="doc-version">v{{ release }}</span></summary>
  <div class="doc-tools-panel">
    <p>GAWorld · 中文文档</p>
    <a href="{{ pathto('index') }}">当前版本 v{{ release }}</a>
    <a href="{{ pathto('read.doc', 1) }}" download>下载 Word 文档</a>
    <a href="https://github.com/wuchaozju/GAWorld">GitHub</a>
    <a href="{{ pathto('../index.html', 1) }}">项目主页</a>
  </div>
</details>
{% endblock %}
