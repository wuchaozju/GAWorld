<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 738" role="img" aria-labelledby="title desc"><title id="title">一次日常仿真的执行过程</title><desc id="desc">依次加载配置、初始化居民和上下文、装配插件及管线、推进每个居民、写入状态与记录、回放和分析。</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="#667a9c"/></marker></defs><style>text{font-family:system-ui,-apple-system,'PingFang SC','Microsoft YaHei',sans-serif;fill:#172f54}.label{font-size:21px;font-weight:600}.sub{font-size:17px;fill:#4d607d}.mono{font-family:ui-monospace,SFMono-Regular,Consolas,monospace;font-size:17px;fill:#214f83}.wire{stroke:#667a9c;stroke-width:2;fill:none;marker-end:url(#arrow)}</style><rect width="880" height="738" rx="12" fill="#f7f9fc"/><rect x="90" y="24" width="700" height="82" rx="8" fill="white" stroke="#c8d4e5"/><text x="440.0" y="58" text-anchor="middle" class="label">1 · 加载运行设置</text><text x="440.0" y="86" text-anchor="middle" class="sub">settings/ · 城市 / 世界路径</text><path d="M440 106 V128" class="wire"/><rect x="90" y="136" width="700" height="82" rx="8" fill="white" stroke="#c8d4e5"/><text x="440.0" y="170" text-anchor="middle" class="label">2 · 初始化居民与运行上下文</text><text x="440.0" y="198" text-anchor="middle" class="sub">run_simulation() · SimContext</text><path d="M440 218 V240" class="wire"/><rect x="90" y="248" width="700" height="82" rx="8" fill="white" stroke="#c8d4e5"/><text x="440.0" y="282" text-anchor="middle" class="label">3 · 装配插件与认知阶段</text><text x="440.0" y="310" text-anchor="middle" class="sub">builtin_plugins() · StagePipeline</text><path d="M440 330 V352" class="wire"/><rect x="90" y="360" width="700" height="82" rx="8" fill="white" stroke="#c8d4e5"/><text x="440.0" y="394" text-anchor="middle" class="label">4 · 按仿真时刻推进居民</text><text x="440.0" y="422" text-anchor="middle" class="sub">感知 → 计划 → 行动 → 反思</text><path d="M440 442 V464" class="wire"/><rect x="90" y="472" width="700" height="82" rx="8" fill="white" stroke="#c8d4e5"/><text x="440.0" y="506" text-anchor="middle" class="label">5 · 更新状态、记忆与记录</text><text x="440.0" y="534" text-anchor="middle" class="sub">memory/ · Recorder · 输出目录</text><path d="M440 554 V576" class="wire"/><rect x="90" y="584" width="700" height="82" rx="8" fill="white" stroke="#c8d4e5"/><text x="440.0" y="618" text-anchor="middle" class="label">6 · 回放与研究分析</text><text x="440.0" y="646" text-anchor="middle" class="sub">simviz · Analytics · parallel/</text><text x="440" y="712" text-anchor="middle" class="sub">日常仿真的执行主线；长时段快进按阶段简报推进状态。</text></svg>