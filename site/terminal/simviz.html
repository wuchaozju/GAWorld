<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>GAWorld // simulation_replay</title>
  <meta name="description" content="GAWorld Terminal — 仿真回放" />
  <meta name="robots" content="noindex" />
  <link rel="icon" type="image/png" href="/site/assets/logo-emergent.png" />
  <link rel="stylesheet" href="/terminal/simviz.css" />
</head>
<body class="brand-on-dark">
  <div class="crt crt-scanlines" aria-hidden="true"></div>
  <div class="crt crt-sweep"     aria-hidden="true"></div>
  <div class="crt crt-vignette"  aria-hidden="true"></div>
  <div class="bg-grid"           aria-hidden="true"></div>

  <div class="page">

    <header class="page-head">
      <a class="brand" href="/terminal/index.html" aria-label="GAWorld home">
        <span class="brand-mark brand-logo" aria-hidden="true"><img class="brand-symbol" src="/site/assets/logo-emergent.png" alt="" width="46" height="46" /></span>
        <span class="brand-name">GAWorld</span>
        <span class="brand-tag">// simulation_replay</span>
      </a>
      <div class="meta">
        <p class="eyebrow">// simviz · replay</p>
        <h1>仿真回放 <span style="color: var(--muted); font-weight: 400;">/ replay</span></h1>
      </div>
      <label class="run-picker">
        <span>运行</span>
        <select id="runSelect"></select>
        <span class="pulse-dot" aria-hidden="true"></span>
      </label>
    </header>

    <section class="workspace">
      <div class="map-shell" id="mapShell" data-frame="frame --/--">
        <canvas id="mapCanvas" width="1200" height="760" aria-label="simulation map"></canvas>
      </div>

      <div id="indoorView" class="indoor-shell" aria-label="indoor activity view"></div>

      <aside class="inspector">
        <div class="now">
          <span id="frameStamp">等待数据</span>
          <strong id="frameTitle">-</strong>
        </div>
        <div id="agentList" class="agent-list"></div>
      </aside>
    </section>

    <footer class="controls">
      <button id="playBtn" type="button">▶ 播放</button>
      <input id="timeline" type="range" min="0" max="0" value="0" />
      <button id="latestBtn" type="button">↻ 最新</button>
      <label>
        <span>速度</span>
        <select id="speedSelect">
          <option value="250">4x</option>
          <option value="500" selected>2x</option>
          <option value="1000">1x</option>
          <option value="1600">0.6x</option>
        </select>
      </label>
      <button id="refreshBtn" type="button">$ refresh</button>
      <span id="statusText" class="status">初始化</span>
    </footer>
  </div>

  <!-- Same scripts as the cream page: behaviour is unchanged; only the chrome differs. -->
  <script src="/site/dashboard/agent-thought.js"></script>
  <script src="/site/dashboard/citymap-view.js"></script>
  <script src="/site/simviz/spatial-tree.js"></script>
  <script src="/site/dashboard/indoor-view.js"></script>
  <script src="/site/simviz/replay.js"></script>

  <script>
    // Wire the "data-frame" overlay to the inspector title so the
    // terminal panel shows current sim time in the chrome, not just inside
    // the inspector card.
    (function () {
      var stamp = document.getElementById('frameStamp');
      var shell = document.getElementById('mapShell');
      if (!stamp || !shell) return;
      var obs = new MutationObserver(function () {
        shell.setAttribute('data-frame', stamp.textContent || 'frame --/--');
      });
      obs.observe(stamp, { childList: true, characterData: true, subtree: true });
    })();
  </script>
</body>
</html>
