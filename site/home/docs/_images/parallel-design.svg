<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 440" role="img" aria-labelledby="title desc"><title id="title">平行世界实验设计</title><desc id="desc">共同基线分为基准、处理和可选的安慰剂条件，分别运行后比较同一居民的差异，再检查跨种子重复。</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="#667a9c"/></marker></defs><style>text{font-family:system-ui,-apple-system,'PingFang SC','Microsoft YaHei',sans-serif;fill:#172f54}.label{font-size:21px;font-weight:600}.sub{font-size:17px;fill:#4d607d}.mono{font-family:ui-monospace,SFMono-Regular,Consolas,monospace;font-size:17px;fill:#214f83}.wire{stroke:#667a9c;stroke-width:2;fill:none;marker-end:url(#arrow)}</style><rect width="880" height="440" rx="12" fill="#f7f9fc"/><rect x="235" y="24" width="410" height="84" rx="8" fill="white" stroke="#c8d4e5"/><text x="440.0" y="58" text-anchor="middle" class="label">共同基线</text><text x="440.0" y="86" text-anchor="middle" class="sub">同一批居民 · 模型 · 种子 · 时间尺度</text><path d="M440 108 V133 H165 V158" class="wire"/><path d="M440 108 V158" class="wire"/><path d="M440 108 V133 H715 V158" class="wire"/><rect x="28" y="168" width="254" height="84" rx="8" fill="white" stroke="#c8d4e5"/><text x="155.0" y="202" text-anchor="middle" class="label">基准世界</text><text x="155.0" y="230" text-anchor="middle" class="sub">保留基准事件与配置</text><rect x="313" y="168" width="254" height="84" rx="8" fill="white" stroke="#c8d4e5"/><text x="440.0" y="202" text-anchor="middle" class="label">处理世界</text><text x="440.0" y="230" text-anchor="middle" class="sub">改变指定事件或参数</text><rect x="598" y="168" width="254" height="84" rx="8" fill="white" stroke="#c8d4e5"/><text x="725.0" y="202" text-anchor="middle" class="label">安慰剂世界（可选）</text><text x="725.0" y="230" text-anchor="middle" class="sub">用于估计噪声底线</text><path d="M165 252 V292 H340 V318" class="wire"/><path d="M440 252 V318" class="wire"/><path d="M715 252 V292 H540 V318" class="wire"/><rect x="158" y="328" width="564" height="84" rx="8" fill="white" stroke="#c8d4e5"/><text x="440.0" y="362" text-anchor="middle" class="label">配对比较与重复运行</text><text x="440.0" y="390" text-anchor="middle" class="sub">轨迹 · 个体差异 · 效应区间 · 跨种子一致性</text></svg>