<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>GAWorld · CityMap (Mapbox)</title>
<style>
  :root {
    --bg:#0c1118; --panel:#141a23; --panel-2:#1a222d; --ink:#e7ecf3;
    --muted:#97a3b4; --line:#2c3644; --accent:#6ea8fe; --accent-2:#5cc2a8;
    --warn:#ffb454; --shadow:0 6px 24px rgba(0,0,0,.45);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);
    font:13px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;overflow:hidden;}
  #app{display:grid;grid-template-columns:1fr 312px;height:100%;}
  #map{position:relative;overflow:hidden;}
  #map .maplibregl-canvas, #map .mapboxgl-canvas{display:block;}
  /* sidebar */
  #side{background:var(--panel);border-left:1px solid var(--line);
    display:flex;flex-direction:column;min-height:0;}
  .side-head{padding:14px 16px 10px;border-bottom:1px solid var(--line);}
  .side-head h1{margin:0;font-size:15px;letter-spacing:.3px;}
  .side-head .sub{color:var(--muted);font-size:11px;margin-top:4px;display:flex;gap:8px;align-items:center;}
  .side-body{padding:12px 16px;overflow-y:auto;flex:1;min-height:0;}
  .group{margin-bottom:16px;}
  .group>.label{color:var(--muted);text-transform:uppercase;letter-spacing:.6px;font-size:10px;margin-bottom:7px;}
  .toggle{display:flex;align-items:center;gap:7px;margin:4px 0;cursor:pointer;user-select:none;}
  .toggle input{accent-color:var(--accent);}
  .stat-row,.cat-row,.metro-row{display:flex;align-items:center;gap:8px;margin:4px 0;}
  .stat-row{justify-content:space-between;color:var(--muted);}
  .stat-row b{color:var(--ink);font-variant-numeric:tabular-nums;}
  .cat-row .swatch,.metro-row .swatch{width:11px;height:11px;border-radius:3px;flex:none;}
  .cat-row .cat-name{flex:1;}
  .cat-row .cat-count{color:var(--muted);font-variant-numeric:tabular-nums;}
  .metro-row{flex-direction:column;align-items:flex-start;gap:3px;}
  .metro-row .metro-stops{color:var(--muted);font-size:11px;line-height:1.4;padding-left:18px;}
  .empty{color:var(--muted);font-size:11px;font-style:italic;}
  .footnote{color:var(--muted);font-size:11px;line-height:1.5;}
  .footnote code{background:var(--panel-2);padding:1px 5px;border-radius:4px;font-size:10px;}
  button{background:var(--panel-2);color:var(--ink);border:1px solid var(--line);
    border-radius:7px;padding:6px 10px;font:inherit;cursor:pointer;margin-right:6px;}
  button:hover{border-color:var(--accent);}
  button.primary{background:var(--accent);color:#0b1018;border-color:var(--accent);font-weight:600;}
  /* engine badges */
  .engine-badge{font-size:10px;padding:2px 8px;border-radius:999px;font-weight:600;}
  .engine-badge.mapbox{background:#1a3b6e;color:#aacaff;border:1px solid #2b4f8b;}
  .engine-badge.maplibre{background:#1e3a2e;color:#a3e3c4;border:1px solid #2c5a45;}
  /* popups */
  .maplibregl-popup-content, .mapboxgl-popup-content{
    background:var(--panel)!important;color:var(--ink)!important;
    border:1px solid var(--line)!important;border-radius:8px!important;
    padding:10px 12px!important;box-shadow:var(--shadow)!important;font:12px/1.5 inherit!important;
  }
  .popup-title{font-weight:600;margin-bottom:6px;color:var(--ink);}
  .popup-row{display:flex;justify-content:space-between;gap:14px;color:var(--muted);margin:2px 0;}
  .popup-row b{color:var(--ink);font-weight:500;}
  /* overlays */
  #legend{position:absolute;left:12px;bottom:12px;background:rgba(20,25,33,.86);
    border:1px solid var(--line);border-radius:9px;padding:10px 12px;max-width:260px;
    backdrop-filter:blur(6px);box-shadow:var(--shadow);z-index:5;}
  #legend .label{color:var(--muted);font-size:10px;text-transform:uppercase;letter-spacing:.6px;margin-bottom:6px;}
  #legend .li{display:flex;align-items:center;gap:6px;font-size:11px;color:var(--ink);margin:3px 0;}
  #legend .li .swatch{width:14px;height:3px;border-radius:2px;}
  #token-bar{position:absolute;left:12px;top:12px;display:flex;gap:8px;z-index:5;}
  #token-bar a{color:var(--accent);background:rgba(20,25,33,.86);border:1px solid var(--line);
    border-radius:8px;padding:6px 10px;font-size:11px;text-decoration:none;backdrop-filter:blur(6px);}
  #token-bar a:hover{border-color:var(--accent);}
  #back-btn{background:rgba(20,25,33,.86);border:1px solid var(--line);color:var(--ink);
    border-radius:8px;padding:6px 10px;font-size:11px;text-decoration:none;backdrop-filter:blur(6px);}
  /* loading */
  #loading{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
    background:var(--bg);color:var(--muted);z-index:10;font-size:13px;flex-direction:column;gap:8px;}
  #loading.hidden{display:none;}
  .spinner{width:24px;height:24px;border:2px solid var(--line);border-top-color:var(--accent);
    border-radius:50%;animation:spin 1s linear infinite;}
  @keyframes spin{to{transform:rotate(360deg);}}
  /* floating error */
  #toast{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);
    background:var(--panel);border:1px solid var(--warn);color:var(--ink);
    border-radius:10px;padding:14px 18px;max-width:380px;box-shadow:var(--shadow);z-index:20;
    display:none;}
  #toast.show{display:block;}
  #toast .title{color:var(--warn);font-weight:600;margin-bottom:4px;}
  #toast .body{color:var(--muted);font-size:12px;line-height:1.5;}
</style>
</head>
<body>
<div id="app">
  <div id="map">
    <div id="loading"><div class="spinner"></div><div>正在加载城市数据…</div></div>
    <div id="toast"><div class="title"></div><div class="body"></div></div>
    <div id="legend">
      <div class="label">图例</div>
      <div class="li"><span class="swatch" style="background:#ffd166"></span>主干道 arterial</div>
      <div class="li"><span class="swatch" style="background:#9bd1ff"></span>次干道 collector</div>
      <div class="li"><span class="swatch" style="background:#7a8aa0"></span>支路 local</div>
      <div class="li"><span class="swatch" style="background:#5fb1e8"></span>河流</div>
      <div class="li"><span class="swatch" style="background:#22d3a0"></span>居民</div>
    </div>
    <div id="token-bar">
      <a id="back-btn" href="/site/citymap/index.html">← 回到旧视图</a>
    </div>
  </div>
  <div id="side"></div>
</div>

<script src="./mapbox.app.js"></script>
<script>
(function () {
  // Read query params.
  const params = new URLSearchParams(location.search);
  const city = params.get("city") || "wuzhen";
  const token = params.get("token") || "";   // empty → fall back to MapLibre
  const theme = params.get("theme") || "dark";

  // Surface a token-config link if none provided.
  if (!token) {
    const bar = document.getElementById("token-bar");
    const a = document.createElement("a");
    a.href = "https://account.mapbox.com/access-tokens/";
    a.target = "_blank"; a.rel = "noopener noreferrer";
    a.textContent = "获取 Mapbox token";
    bar.appendChild(a);
  } else {
    const bar = document.getElementById("token-bar");
    const a = document.createElement("a");
    a.href = "?" + new URLSearchParams({ city, theme }).toString();
    a.textContent = "切换到无 token 模式";
    bar.appendChild(a);
  }

  function showError(title, body) {
    const el = document.getElementById("toast");
    el.querySelector(".title").textContent = title;
    el.querySelector(".body").textContent = body;
    el.classList.add("show");
    document.getElementById("loading").classList.add("hidden");
  }

  function hideLoading() {
    document.getElementById("loading").classList.add("hidden");
  }

  async function boot() {
    try {
      const view = new GAWorldMapView(
        document.getElementById("map"),
        document.getElementById("side"),
        { mapboxToken: token, theme },
      );
      view.mapEl = document.getElementById("map"); // attach for popup positioning
      // Override map factory callback to hide loading when ready
      const origLoad = view.load.bind(view);
      view.load = async function (slug) {
        await origLoad(slug);
        // Hide loading after the style has rendered at least once.
        const once = () => { hideLoading(); this.map.off("idle", once); };
        view.map.on("idle", once);
        // Failsafe: hide after 4s no matter what.
        setTimeout(hideLoading, 4000);
      };
      await view.load(city);
      window.__view = view;
    } catch (err) {
      console.error(err);
      showError("加载失败", String(err && err.message || err));
    }
  }
  boot();
})();
</script>
</body>
</html>
