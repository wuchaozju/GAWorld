<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>GAWorld · 工作空间</title>
  <script src="/site/theme.js"></script>
  <link rel="icon" href="/site/auth/brand/gaworld-symbol-a.png">
  <link rel="stylesheet" href="/site/community/community.css">
  <link rel="stylesheet" href="/site/tokens.css">
  <link rel="stylesheet" href="/site/community/api-tokens.css">
</head>
<body>
  <div class="work-layout">
    <main id="app" class="work-main"><p class="loading" data-i18n="workspace.loading">正在打开工作空间…</p></main>
  </div>
  <template id="localWorkspace">
    <header class="workspace-welcome">
      <p class="eyebrow">GAWORLD / WORKSPACE</p>
      <h1 data-i18n="workspace.local_title">从这里，开始你的研究。</h1>
      <p class="muted" data-i18n="workspace.local_description">构建城市与居民，开展实验，回看结果。所有工具都在同一个工作空间。</p>
      <div class="toolbar">
        <a class="button" href="/console#research" data-i18n="workspace.new_research">新建研究 ↗</a>
        <a class="button secondary" href="/console#dashboard" data-i18n="workspace.simulation">打开仿真控制台</a>
      </div>
    </header>
    <div class="section-head"><h2 data-i18n="workspace.tools_title">选择下一步</h2></div>
    <div class="grid workspace-start">
      <a class="card" href="/console#city">
        <p class="eyebrow">01 / BUILD</p><h3 data-i18n="nav.city">城市</h3>
        <p class="muted" data-i18n="workspace.city_note">创建或选择城市，让研究有具体的生活场景。</p>
        <span class="workspace-card-link" data-i18n="workspace.open_tool">打开工具 ↗</span>
      </a>
      <a class="card" href="/console#population">
        <p class="eyebrow">02 / POPULATION</p><h3 data-i18n="nav.population">人口与群体</h3>
        <p class="muted" data-i18n="workspace.population_note">设置人口结构，为你的问题准备合适的居民群体。</p>
        <span class="workspace-card-link" data-i18n="workspace.open_tool">打开工具 ↗</span>
      </a>
      <a class="card" href="/console#studio">
        <p class="eyebrow">03 / AGENTS</p><h3 data-i18n="nav.studio">智能体工作台</h3>
        <p class="muted" data-i18n="workspace.studio_note">查看和编辑居民的身份、性格、记忆与关系。</p>
        <span class="workspace-card-link" data-i18n="workspace.open_tool">打开工具 ↗</span>
      </a>
      <a class="card" href="/console#analytics">
        <p class="eyebrow">04 / RESULTS</p><h3 data-i18n="nav.analytics">回放与分析</h3>
        <p class="muted" data-i18n="workspace.analytics_note">回看仿真过程，查看数据、比较变化并导出结果。</p>
        <span class="workspace-card-link" data-i18n="workspace.open_tool">打开工具 ↗</span>
      </a>
    </div>
    <p class="workspace-local-note" data-i18n="workspace.local_note">当前使用本地工作空间。城市、居民与研究结果由左侧工具统一管理。</p>
  </template>
  <template id="accountWorkspace">
    <header class="workspace-welcome">
      <p class="eyebrow">GAWORLD / WORKSPACE</p>
      <h1 data-i18n="workspace.account_title">个人内容需要账号</h1>
      <p class="muted" data-i18n="workspace.account_note">个人研究列表、发布记录和账号设置需要个人账号。你仍可从空间总览使用研究和仿真工具。</p>
      <div class="toolbar"><a class="button" href="/console#workspace" data-i18n="workspace.back_overview">返回空间总览</a></div>
    </header>
  </template>
  <div id="notice" role="status" aria-live="polite" hidden></div>
  <script src="/site/dashboard/i18n.js"></script>
  <script src="/site/community/navigation.js"></script>
  <script src="/site/community/common.js"></script>
  <script src="/site/community/api-tokens.js"></script>
  <script src="/site/community/workspace.js"></script>
</body>
</html>
