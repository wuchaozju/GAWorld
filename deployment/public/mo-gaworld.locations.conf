# Merge into the EXISTING mo.zju.edu.cn HTTPS server block.
# Replace overlapping locations; do not define /api/ or /site/ globally.
# Port 8780 is the GAWorld gateway: it strips the Relay prefix itself.

location ^~ /agent-relay/ {
    proxy_pass http://10.72.74.13:8780;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
}

location = /agent-relay {
    return 308 /agent-relay/health;
}

location = /site/tokens.css {
    proxy_pass http://10.72.74.13:8780;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
}

location ^~ /video/public/ {
    proxy_pass http://10.72.74.13:8780;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
}

location ~ ^/(console|dashboard|board|login|join|reset)(/)?$ {
    proxy_pass http://10.72.74.13:8780;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
}

location ~ ^/site/(console|dashboard|simviz|mobile|auth|assets|citymap)(/|$) {
    proxy_pass http://10.72.74.13:8780;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
}

location ~ ^/api/(health|auth|worlds|play|cluster|interventions|events|organizations|infosources|bench|import|arena|games|research|persona|moltbook|home|todos|twin|config|agents|skills|run|trace|replay|life-events|collaboration|population|family|external-systems|parallel-worlds|settings|analytics|fos-export|relationships|cities|city|interview|economy|performance|state-history)(/|$) {
    proxy_pass http://10.72.74.13:8780;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
}

location = /api/openapi.json {
    proxy_pass http://10.72.74.13:8780;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
}

location ^~ /play/ {
    proxy_pass http://10.72.74.13:8780;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
}

location ^~ /output/ {
    proxy_pass http://10.72.74.13:8780;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
}
