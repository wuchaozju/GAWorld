# Include inside the existing mo.zju.edu.cn HTTPS server block.
# Requires an adapted backend with GAWORLD_URL_PREFIX=/GAWorld.
# Do not combine this with the legacy root-route fragment for this mount.
location = /GAWorld {
    return 308 /GAWorld/$is_args$args;
}

location ^~ /GAWorld/ {
    # No URI suffix: the application receives /GAWorld/... unchanged.
    proxy_pass http://10.72.74.13:8766;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_intercept_errors off;
    proxy_cache off;
    proxy_buffering off;
    proxy_connect_timeout 10s;
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;
}
