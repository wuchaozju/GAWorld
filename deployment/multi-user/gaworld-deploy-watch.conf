[Unit]
Description=GAWorld main release auto deployment watcher

[Service]
ExecStart=
ExecStart=%h/GAWorld/.venv-deploy/bin/python -m gaworld.apps.deploy_services watch --repo %h/GAWorld --branch main --process-manager systemd-user --no-venv --python %h/GAWorld/.venv-deploy/bin/python --host 0.0.0.0 --dashboard-port 8766 --relay-port 8877 --interval 60
