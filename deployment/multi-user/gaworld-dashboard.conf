# Install as ~/.config/systemd/user/gaworld-dashboard.service.d/multi-user.conf
# Initialize this database before restarting the service. Never commit its contents.
[Service]
# Explicitly enable multi-user mode; adjust host/port/runtime path for custom deployments.
ExecStart=
ExecStart=%h/GAWorld/.venv-deploy/bin/python -m gaworld.apps.dashboard_server --host 0.0.0.0 --port 8766 --multi-user True
Environment=GAWORLD_REQUIRE_ACCOUNTS=1
Environment=GAWORLD_ACCOUNTS_DB=%h/.local/share/gaworld/accounts.sqlite
UMask=0077
