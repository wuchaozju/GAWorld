name: CI

on:
  push:
    branches: [main, Dev]
  pull_request:
    branches: [main, Dev]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4
        with:
          # The lint ratchet compares changed files with the target branch.
          fetch-depth: 0

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Chromium for the browser smoke tests
        run: python -m playwright install --with-deps chromium

      - name: Lint ratchet (changed files may not get worse)
        # The repo predates enforcement (~1,000 findings, ~400 unformatted
        # files), so `ruff check .` would fail every run. Instead: a changed
        # file may not gain findings, a formatted or new file must stay
        # formatted, and the repo totals may not rise (scripts/lint_baseline.json).
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BASE="origin/${{ github.base_ref }}"
          else
            BASE="${{ github.event.before }}"
          fi
          if ! git cat-file -e "${BASE}^{commit}" 2>/dev/null; then BASE="HEAD~1"; fi
          python scripts/lint_ratchet.py --base "$BASE"

      - name: Mypy (gaworld package)
        # mypy is advisory until the migration is complete: don't fail the build.
        continue-on-error: true
        run: mypy gaworld

      - name: Run tests with coverage threshold
        # The fail-under floor protects gaworld/ specifically; the
        # legacy modules will be migrated in subsequent stages.
        run: |
          pytest tests \
            --cov=gaworld \
            --cov-report=term-missing \
            --cov-report=xml \
            --cov-fail-under=80

      - name: Upload coverage artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-${{ matrix.python-version }}
          path: coverage.xml
          if-no-files-found: ignore
